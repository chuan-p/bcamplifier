<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Fan | Bandcamp</title>
  </head>
  <body>
    <div
      id="grid-tabs-sticky"
      style="position: sticky; top: 0; height: 64px"
    ></div>
    <div
      id="pagedata"
      data-blob='{"fan_data":{"fan_id":42,"is_own_page":true,"name":"Fixture Fan"},"current_fan":{"fan_id":42},"collection_data":{"last_token":"fixture-collection-token","item_count":3,"batch_size":20,"sequence":[]}}'
      hidden
    ></div>

    <div id="collection-search">
      <input
        type="search"
        class="search-box"
        placeholder="search your collection"
      />
    </div>
    <div id="wishlist-search">
      <input
        type="search"
        class="search-box"
        placeholder="search your wishlist"
      />
    </div>

    <div class="collection-tabs">
      <ol>
        <li data-tab="collection" data-grid-id="collection-grid">collection</li>
        <li data-tab="wishlist" data-grid-id="wishlist-grid">wishlist</li>
        <li class="active" data-tab="followers" data-grid-id="followers-grid">
          followers
        </li>
        <li data-tab="following" data-grid-id="following-grid">following</li>
      </ol>
    </div>

    <div id="grids">
      <div id="collection-grid" class="grid">
        <div class="collection-items">
          <ol class="collection-grid"></ol>
        </div>
      </div>
      <div id="wishlist-grid" class="grid">
        <div class="collection-items">
          <ol class="collection-grid"></ol>
        </div>
      </div>
      <div id="collection-search-grid" class="grid">
        <div class="collection-items">
          <ol class="collection-grid"></ol>
        </div>
      </div>
      <div id="wishlist-search-grid" class="grid">
        <div class="collection-items">
          <ol class="collection-grid"></ol>
        </div>
      </div>
      <div id="followers-grid" class="grid active">
        <p>Fixture followers</p>
      </div>
      <div id="following-grid" class="grid">
        <p>Fixture following</p>
      </div>
    </div>

    <script>
      (() => {
        const storage = new Map([
          ["bcampx:userSettings", { showCollectionCounts: true, enableTagSearch: true }],
          ["bcampx:artistMusicView", "feed"],
          [
            "bcampx:release:https://fixture.bandcamp.com/album/release-4",
            {
              url: "https://fixture.bandcamp.com/album/release-4",
              title: "Release 4",
              artist: "Artist 4",
              hasBodyDescriptionSource: false,
              tracks: [
                {
                  title: "Track 4",
                  trackId: "4",
                  streamUrl: "https://expired.example.com/4.mp3",
                  duration: "2:00",
                  titleLink:
                    "https://fixture.bandcamp.com/album/release-4/track-4",
                },
                {
                  title: "Track 4B",
                  trackId: "404",
                  streamUrl: "https://expired.example.com/404.mp3",
                  duration: "2:30",
                  titleLink:
                    "https://fixture.bandcamp.com/album/release-4/track-4b",
                },
              ],
              schemaVersion: 18,
              fetchedAt: Date.now() - 60 * 60 * 1000,
            },
          ],
        ]);
        globalThis.__fixtureReleaseRequestCount = 0;
        globalThis.__fixtureSupporterRequestCount = 0;
        globalThis.Dom = {
          scrollToElement: (target, offset) => {
            const card =
              target &&
              target.closest &&
              target.closest(
                ".bcampx-label-feed-card[data-bcampx-release-url]",
              );
            const trackButton =
              target &&
              (target.matches?.(".bcampx__track-link")
                ? target
                : target.querySelector?.(".bcampx__track-link"));
            document.documentElement.setAttribute(
              "data-bcampx-player-scroll-release",
              card
                ? card.getAttribute("data-bcampx-release-url") || ""
                : "",
            );
            document.documentElement.setAttribute(
              "data-bcampx-player-scroll-track",
              trackButton ? trackButton.dataset.trackId || "" : "",
            );
            document.documentElement.setAttribute(
              "data-bcampx-player-scroll-offset",
              String(offset),
            );
          },
        };

        const fixtureReleaseTags = {
          1: ["nativeleft"],
          2: ["nativeleft"],
          9: ["techno"],
          10: ["leftfield", "tech house"],
          11: ["jazz"],
          21: ["indexart"],
          30: ["fallback"],
        };
        globalThis.__BCAMPX_HOST__ = {
          kind: "webextension",
          requestHtml: async (url) => {
            globalThis.__fixtureReleaseRequestCount += 1;
            const id = Number(url.match(/release-(\d+)/)?.[1] || 1);
            if (id === 4) {
              await new Promise((resolve) =>
                window.setTimeout(resolve, 700),
              );
            }
            const trackInfo =
              id === 30
                ? "[]"
                : id === 4
                ? `[
                    {"title":"Track 4","track_id":4,"file":{"mp3-128":"https://example.com/4.mp3"},"duration":120},
                    {"title":"Track 4B","track_id":404,"file":{"mp3-128":"https://example.com/404.mp3"},"duration":150}
                  ]`
                : `[{"title":"Track ${id}","track_id":${id},"file":{"mp3-128":"https://example.com/${id}.mp3"},"duration":120}]`;
            return `<!DOCTYPE html>
              <div id="pagedata" data-blob='{"identities":{"fan":{"id":42}},"fan_tralbum_data":{"is_wishlisted":true}}'></div>
              <div data-tralbum='{"current":{"id":${id},"type":"album","title":"Release ${id}","band_id":${1000 + id}},"artist":"Artist ${id}","trackinfo":${trackInfo}}'></div>
              <div id="collectors-data" data-blob='{"thumbs":[{"fan_id":1},{"fan_id":2},{"fan_id":3}],"reviews":[],"shown_reviews":[],"more_thumbs_available":false}'></div>
              <div class="tralbum-tags">${(fixtureReleaseTags[id] || [])
                .map(
                  (tag) =>
                    `<a href="/tag/${tag.replace(/ /g, "-")}">${tag}</a>`,
                )
                .join(" ")}</div>
              <li class="buyItem digital"><span class="base-text-color">$5</span></li>`;
          },
          requestJson: async (url) => {
            if (url.includes("/api/fancollection/1/collection_items")) {
              return {
                items: [
                  __makeFanIndexItem(9, "techno"),
                  __makeFanIndexItem(10, "tech house"),
                  __makeFanIndexItem(11, "jazz"),
                  __makeFanIndexItem(21, "indexart", { artId: 54321 }),
                  __makeFanIndexItem(30, "fallback", { artId: 30303 }),
                ],
                more_available: false,
                last_token: "",
                tracklists: {},
                redownload_urls: {},
                item_lookup: {},
              };
            }
            if (url.includes("/api/mobile/24/tralbum_details")) {
              const id = Number(
                (url.match(/tralbum_id=(\d+)/) || [])[1] || 0,
              );
              return {
                id,
                about: `About ${id}`,
                tracks:
                  id === 30
                    ? [
                        {
                          track_id: 3001,
                          title: "API Track 30",
                          duration: 120,
                          streaming_url: {
                            "mp3-128": "https://example.com/api-30.mp3",
                          },
                          track_url: `https://fixture.bandcamp.com/track/api-30`,
                        },
                      ]
                    : [],
                tags: (fixtureReleaseTags[id] || []).map((name) => ({ name })),
              };
            }
            globalThis.__fixtureSupporterRequestCount += 1;
            return { results: [], more_available: false };
          },
          storageGet: async (key, fallback) =>
            storage.has(key) ? storage.get(key) : fallback,
          storageSet: async (key, value) => {
            storage.set(key, value);
          },
          storageGetByPrefix: async (prefix) => {
            const values = {};
            storage.forEach((value, key) => {
              if (key.startsWith(prefix)) {
                values[key] = value;
              }
            });
            return values;
          },
          storageRemove: async (key) => {
            storage.delete(key);
          },
        };

        globalThis.__makeFanIndexItem = (id, tag, options = {}) => {
          const releaseUrl = `https://fixture.bandcamp.com/album/release-${id}`;
          return {
            item_id: id,
            item_type: "album",
            tralbum_id: id,
            tralbum_type: "a",
            band_id: 1000 + id,
            item_title: `Release ${id}`,
            band_name: `Artist ${id}`,
            item_url: releaseUrl,
            item_art_id: Number(options.artId) || 12345,
            also_collected_count: 7,
            featured_track: id,
            featured_track_title: `Track ${id}`,
            tags: [tag],
          };
        };

        globalThis.__makeFanFixtureItem = (id, options = {}) => {
          const item = document.createElement("li");
          const releaseUrl = `https://fixture.bandcamp.com/album/release-${id}`;
          item.className = "collection-item-container";
          item.setAttribute("data-itemid", String(id));
          item.setAttribute("data-tralbumid", String(id));
          item.setAttribute("data-tralbumtype", "a");
          item.setAttribute("data-bandid", String(1000 + id));
          item.setAttribute(
            "data-playerdata",
            JSON.stringify({
              album: {
                id,
                title: `Release ${id}`,
                url: releaseUrl,
                is_owned: Boolean(options.owned),
                price: { amount: 5, currency: "USD", is_money: true },
              },
              id,
              title: `Track ${id}`,
              artist_name: `Artist ${id}`,
              url: `${releaseUrl}/track-${id}`,
              stream_url: `https://example.com/${id}.mp3`,
              duration: 120,
            }),
          );
          item.innerHTML = `
            <a class="item-link" href="${releaseUrl}">
              <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" />
              <span class="collection-item-title">Release ${id}</span>
              <span class="collection-item-artist">by Artist ${id}</span>
            </a>
            ${
              options.download
                ? `<span class="redownload-item"><a href="https://bandcamp.com/download/${id}">download</a></span>`
                : ""
            }
            ${
              options.countLabel
                ? `<div class="collected-by"><div class="collected-by-header">${options.countLabel}</div></div>`
                : ""
            }`;
          return item;
        };
      })();
    </script>
    <script src="/bcamplifier.user.js"></script>
    <script>
      (async () => {
        const wait = (ms) =>
          new Promise((resolve) => window.setTimeout(resolve, ms));
        const setActiveGrid = (id) => {
          document.querySelectorAll("#grids > .grid").forEach((grid) => {
            grid.classList.toggle("active", grid.id === id);
          });
          document.querySelectorAll("[data-grid-id]").forEach((tab) => {
            tab.classList.toggle(
              "active",
              tab.getAttribute("data-grid-id") === id,
            );
          });
        };
        document.querySelectorAll("[data-grid-id]").forEach((tab) => {
          tab.addEventListener("click", () => {
            setActiveGrid(tab.getAttribute("data-grid-id"));
          });
        });
        const feedUrls = () =>
          Array.from(
            document.querySelectorAll(
              ".bcampx-label-feed-card[data-bcampx-release-url]",
            ),
          ).map((card) => card.getAttribute("data-bcampx-release-url"));
        const waitForStableBackgroundWork = async () => {
          let previous = "";
          let stableSamples = 0;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            const current = [
              globalThis.__fixtureReleaseRequestCount,
              document.documentElement.getAttribute(
                "data-bcampx-scan-count",
              ) || "0",
              document.documentElement.getAttribute(
                "data-bcampx-label-feed-sync-run-count",
              ) || "0",
            ].join(":");
            stableSamples =
              current === previous ? stableSamples + 1 : 0;
            if (stableSamples >= 4) {
              return;
            }
            previous = current;
            await wait(100);
          }
        };

        await wait(150);
        document.documentElement.setAttribute(
          "data-bcampx-followers-toggle-absent",
          String(!document.querySelector(".bcampx-label-feed-toggle")),
        );

        const collection = document.querySelector(
          "#collection-grid .collection-grid",
        );
        collection.append(
          __makeFanFixtureItem(1, {
            owned: true,
            download: true,
            countLabel: "appears in 1.234 other collections",
          }),
          __makeFanFixtureItem(2, {
            owned: true,
            download: true,
            countLabel: "appears in 12 other collections",
          }),
        );
        setActiveGrid("collection-grid");
        await wait(900);
        document.documentElement.setAttribute(
          "data-bcampx-collection-card-count",
          String(feedUrls().length),
        );
        document.documentElement.setAttribute(
          "data-bcampx-collection-toggle-visible",
          String(
            Boolean(
              document.querySelector(".bcampx-label-feed-toggle:not([hidden])"),
            ),
          ),
        );
        const initialCollectionCard = document.querySelector(
          '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-1"]',
        );
        document.documentElement.setAttribute(
          "data-bcampx-localized-dot-count",
          initialCollectionCard
            ?.querySelector(".bcampx-label-feed-card__supporter-count")
            ?.getAttribute("data-bcampx-supporter-count") || "",
        );

        const search = document.querySelector(
          "#collection-search-grid .collection-grid",
        );
        search.append(__makeFanFixtureItem(1));
        setActiveGrid("collection-search-grid");
        await wait(500);
        document.documentElement.setAttribute(
          "data-bcampx-search-first",
          feedUrls().join(","),
        );

        search.replaceChildren(__makeFanFixtureItem(3));
        await wait(500);
        document.documentElement.setAttribute(
          "data-bcampx-search-reconciled",
          feedUrls().join(","),
        );

        const wishlist = document.querySelector(
          "#wishlist-grid .collection-grid",
        );
        wishlist.append(
          __makeFanFixtureItem(4, {
            countLabel: "appears in 1 234 collections",
          }),
          ...Array.from({ length: 12 }, (_, index) =>
            __makeFanFixtureItem(index + 5),
          ),
        );
        setActiveGrid("wishlist-grid");
        await wait(350);
        const earlyWishlistCard = document.querySelector(
          '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-4"]',
        );
        const earlyWishlistTracks = earlyWishlistCard
          ? Array.from(
              earlyWishlistCard.querySelectorAll(".bcampx__track-link"),
            )
          : [];
        document.documentElement.setAttribute(
          "data-bcampx-cached-tracklist-early-count",
          String(earlyWishlistTracks.length),
        );
        document.documentElement.setAttribute(
          "data-bcampx-cached-native-stream",
          earlyWishlistTracks[0]?.dataset.streamUrl || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-cached-stale-stream-cleared",
          String(
            Boolean(
              earlyWishlistTracks[1] &&
                !earlyWishlistTracks[1].dataset.streamUrl,
            ),
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-loading-summary",
          earlyWishlistCard
            ? earlyWishlistCard
                .querySelector(".bcampx__summary-text")
                ?.textContent.trim() || ""
            : "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-loading-state",
          String(
            Boolean(
              earlyWishlistCard &&
                earlyWishlistCard.querySelector(
                  ".bcampx[data-bcampx-loading-extra-context='true']",
                ),
            ),
          ),
        );
        const slotLoading = earlyWishlistCard
          ? earlyWishlistCard.querySelector(".bcampx__slot-loading")
          : null;
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-slot-loading",
          slotLoading ? slotLoading.textContent.trim() : "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-slot-loading-visible",
          String(Boolean(slotLoading && !slotLoading.hidden)),
        );
        await wait(900);
        const supporterCount = document.querySelector(
          ".bcampx-label-feed-card__supporter-count",
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-count",
          supporterCount ? supporterCount.textContent.trim() : "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-localized-space-count",
          supporterCount
            ? supporterCount.getAttribute(
                "data-bcampx-supporter-count",
              ) || ""
            : "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-count-exact",
          supporterCount
            ? supporterCount.getAttribute(
                "data-bcampx-supporter-count-exact",
              ) || ""
            : "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-supporter-request-count",
          String(globalThis.__fixtureSupporterRequestCount),
        );
        const firstWishlistTrack = document.querySelector(
          '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-4"] .bcampx__track-link',
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-refreshed-stream",
          firstWishlistTrack
            ? firstWishlistTrack.dataset.streamUrl || ""
            : "",
        );
        const refreshedWishlistTracks = Array.from(
          document.querySelectorAll(
            '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-4"] .bcampx__track-link',
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-second-refreshed-stream",
          refreshedWishlistTracks[1]?.dataset.streamUrl || "",
        );

        wishlist.firstElementChild.setAttribute(
          "data-title",
          "Release 4 updated",
        );
        await wait(300);
        const wishlistCards = Array.from(
          document.querySelectorAll(".bcampx-label-feed-card"),
        );
        const lastWishlistCard = wishlistCards[wishlistCards.length - 1];
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-last-card-preview",
          String(
            Boolean(
              lastWishlistCard &&
                lastWishlistCard.querySelector(".bcampx__track-link"),
            ),
          ),
        );
        if (lastWishlistCard) {
          lastWishlistCard.scrollIntoView();
          await wait(1800);
        }
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-last-card-loaded",
          String(
            Boolean(
              lastWishlistCard &&
                lastWishlistCard.querySelector(".bcampx__track-link"),
            ),
          ),
        );

        setActiveGrid("collection-grid");
        await wait(300);
        setActiveGrid("wishlist-grid");
        await wait(300);
        await waitForStableBackgroundWork();
        const tabSwitchRequestCount = globalThis.__fixtureReleaseRequestCount;
        const tabSwitchEnhancedCount = Number(
          document.documentElement.getAttribute(
            "data-bcampx-enhanced-count",
          ) || 0,
        );
        const tabSwitchSyncCount = Number(
          document.documentElement.getAttribute(
            "data-bcampx-label-feed-sync-run-count",
          ) || 0,
        );
        const tabSwitchScanCount = Number(
          document.documentElement.getAttribute(
            "data-bcampx-scan-count",
          ) || 0,
        );
        for (let cycle = 0; cycle < 6; cycle += 1) {
          for (const gridId of [
            "collection-grid",
            "wishlist-grid",
            "followers-grid",
            "following-grid",
          ]) {
            setActiveGrid(gridId);
            await wait(25);
          }
        }
        setActiveGrid("collection-grid");
        await wait(200);
        const restoredCollectionCard = document.querySelector(
          '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-1"]',
        );
        document.documentElement.setAttribute(
          "data-bcampx-tab-card-reused",
          String(
            Boolean(
              initialCollectionCard &&
                restoredCollectionCard === initialCollectionCard,
            ),
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tab-enhance-delta",
          String(
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-enhanced-count",
              ) || 0,
            ) - tabSwitchEnhancedCount,
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tab-request-delta",
          String(
            globalThis.__fixtureReleaseRequestCount - tabSwitchRequestCount,
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tab-sync-delta",
          String(
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-label-feed-sync-run-count",
              ) || 0,
            ) - tabSwitchSyncCount,
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tab-scan-delta",
          String(
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-scan-count",
              ) || 0,
            ) - tabSwitchScanCount,
          ),
        );
        setActiveGrid("wishlist-grid");
        await wait(100);

        // The wishlist cards are built asynchronously; wait for the first
        // track row before clicking it.
        let wishlistTrackButton = null;
        for (let attempt = 0; attempt < 40 && !wishlistTrackButton; attempt += 1) {
          wishlistTrackButton = document.querySelector(
            ".bcampx-label-feed .bcampx__track-link",
          );
          if (!wishlistTrackButton) {
            await wait(100);
          }
        }
        if (wishlistTrackButton) {
          wishlistTrackButton.click();
          // Release 4's stubbed page fetch takes 700 ms; leave enough room for
          // the fetch, parse and favourite-state sync to settle.
          await wait(1600);
        }
        const playerHost = document.querySelector("#bcampx-player-host");
        const readFavoriteButton = () =>
          playerHost &&
          playerHost.shadowRoot &&
          playerHost.shadowRoot.querySelector(".bcampx-player-favorite");
        // The favourite state is fetched asynchronously; wait for it instead
        // of sampling one instant.
        let favoriteButton = readFavoriteButton();
        for (
          let attempt = 0;
          attempt < 30 &&
          !(favoriteButton && favoriteButton.getAttribute("aria-pressed") === "true");
          attempt += 1
        ) {
          await wait(100);
          favoriteButton = readFavoriteButton();
        }
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-player-enabled",
          String(Boolean(favoriteButton && !favoriteButton.disabled)),
        );
        document.documentElement.setAttribute(
          "data-bcampx-wishlist-player-active",
          String(
            Boolean(
              favoriteButton &&
                favoriteButton.getAttribute("aria-pressed") === "true",
            ),
          ),
        );
        setActiveGrid("followers-grid");
        await wait(100);
        const playerTrackLink =
          playerHost &&
          playerHost.shadowRoot &&
          playerHost.shadowRoot.querySelector(".bcampx-player-track");
        if (playerTrackLink) {
          playerTrackLink.click();
          await wait(700);
        }
        document.documentElement.setAttribute(
          "data-bcampx-player-returned-grid",
          document.querySelector("#grids > .grid.active")?.id || "",
        );
        if (favoriteButton) {
          favoriteButton.click();
          document.documentElement.setAttribute(
            "data-bcampx-wishlist-player-pending",
            String(
              favoriteButton.classList.contains(
                "bcampx-player-button--pending",
              ),
            ),
          );
        }

        // Tag-aware search: Bandcamp's own search index only covers titles and
        // artists, so a tag-only match has to come from the locally built tag
        // index and is appended after the native results.
        setActiveGrid("collection-search-grid");
        const collectionSearchGrid = document.querySelector(
          "#collection-search-grid .collection-grid",
        );
        collectionSearchGrid.replaceChildren(__makeFanFixtureItem(3));
        await wait(200);

        const searchInput = document.querySelector("#collection-search input");
        searchInput.value = "techno";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));

        for (let attempt = 0; attempt < 60; attempt += 1) {
          if (
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-tag-search-matches",
              ) || 0,
            ) > 0
          ) {
            break;
          }
          await wait(100);
        }
        await wait(600);

        const feedCardUrls = Array.from(
          document.querySelectorAll(
            ".bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-release-url]",
          ),
        ).map((card) => card.getAttribute("data-bcampx-release-url"));
        const tagSearchCards = Array.from(
          document.querySelectorAll(
            '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-tag-source="tags"]',
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-card-count",
          String(tagSearchCards.length),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-card-url",
          tagSearchCards[0]?.getAttribute("data-bcampx-release-url") || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-card-order",
          feedCardUrls.join(","),
        );

        // Every tag result must end up with its tracklist, not just the first
        // visible card.
        await wait(2500);
        const tagCardsNow = Array.from(
          document.querySelectorAll(
            '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-tag-source="tags"]',
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-cards-total",
          String(tagCardsNow.length),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-cards-with-tracks",
          String(
            tagCardsNow.filter((card) =>
              card.querySelector(".bcampx__track-link"),
            ).length,
          ),
        );

        // Tag-only results belong to the enhanced list. The native grid must
        // stay free of injected cards and of a tag block.
        const viewToggle = document.querySelector(".bcampx-label-feed-toggle");
        if (viewToggle) {
          viewToggle.click();
          await wait(900);
        }
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-view",
          document.documentElement.getAttribute(
            "data-bcampx-label-feed-view",
          ) || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-section-count",
          String(document.querySelectorAll(".bcampx-tag-results").length),
        );
        if (viewToggle) {
          viewToggle.click();
          await wait(900);
        }

        // Bandcamp's native search response arrives after the local tag
        // matches. The card that already loaded its tracklist must survive.
        for (let attempt = 0; attempt < 40; attempt += 1) {
          if (tagSearchCards[0]?.querySelector(".bcampx__track-link")) {
            break;
          }
          await wait(100);
        }
        const probeCard = tagSearchCards[0];
        if (probeCard) {
          probeCard.setAttribute("data-bcampx-probe", "1");
        }
        collectionSearchGrid.append(__makeFanFixtureItem(9));
        await wait(900);
        const probedCard = document.querySelector(
          '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-probe="1"]',
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-card-survived",
          String(
            Boolean(probedCard) &&
              Boolean(probedCard.querySelector(".bcampx__track-link")),
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-card-copies",
          String(
            Array.from(
              document.querySelectorAll(
                '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-9"]',
              ),
            ).length,
          ),
        );

        document.documentElement.setAttribute(
          "data-bcampx-tag-search-matched-before-clear",
          document.documentElement.getAttribute(
            "data-bcampx-tag-search-matches",
          ) || "",
        );

        // Clearing the box must drop the tag-only cards and the native block.
        searchInput.value = "";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));
        await wait(800);
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-cleared-matches",
          document.documentElement.getAttribute(
            "data-bcampx-tag-search-matches",
          ) || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-cleared-feed-count",
          String(
            document.querySelectorAll(
              '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-tag-source="tags"]',
            ).length,
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-cleared-section",
          String(Boolean(document.querySelector(".bcampx-tag-results"))),
        );

        // A tag-only query leaves Bandcamp with no native matches, so it prints
        // its own "There are no matches for ..." notice next to our results.
        setActiveGrid("collection-search-grid");
        const noMatchToggle = document.querySelector(
          ".bcampx-label-feed-toggle",
        );
        if (noMatchToggle) {
          noMatchToggle.click();
          await wait(900);
        }
        const noMatch = document.createElement("div");
        noMatch.className = "no-match";
        noMatch.textContent = "There are no matches for “leftfield”.";
        collectionSearchGrid.replaceChildren(noMatch);
        searchInput.value = "leftfield";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));
        for (let attempt = 0; attempt < 60; attempt += 1) {
          if (
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-tag-search-matches",
              ) || 0,
            ) === 1
          ) {
            break;
          }
          await wait(100);
        }
        await wait(800);

        document.documentElement.setAttribute(
          "data-bcampx-tag-search-no-match-hidden",
          String(
            Boolean(
              noMatch.isConnected &&
                window.getComputedStyle(noMatch).display === "none",
            ),
          ),
        );
        if (noMatchToggle) {
          noMatchToggle.click();
          await wait(900);
        }
        const feedNode = document.querySelector(".bcampx-label-feed");
        document.documentElement.setAttribute(
          "data-bcampx-feed-outside-grid",
          String(Boolean(feedNode && !feedNode.closest(".grid"))),
        );
        if (feedNode && feedNode.parentElement) {
          const feedRect = feedNode.getBoundingClientRect();
          const parentRect = feedNode.parentElement.getBoundingClientRect();
          document.documentElement.setAttribute(
            "data-bcampx-feed-centered",
            String(
              Math.abs(
                feedRect.left -
                  parentRect.left -
                  (parentRect.right - feedRect.right),
              ) < 3,
            ),
          );
        }
        const noMatchCards = Array.from(
          document.querySelectorAll(
            '.bcampx-label-feed-card[data-bcampx-tag-source="tags"]',
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-no-match-card",
          noMatchCards[0]?.getAttribute("data-bcampx-release-url") || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-search-no-match-leak",
          String(
            noMatchCards.some((card) =>
              /There are no matches/i.test(card.textContent || ""),
            ),
          ),
        );

        const playerHostEl = document.querySelector("#bcampx-player-host");
        const settingsRows =
          playerHostEl && playerHostEl.shadowRoot
            ? Array.from(
                playerHostEl.shadowRoot.querySelectorAll(
                  ".bcampx-player-settings-row",
                ),
              )
            : [];
        const tagSettingRow = settingsRows[settingsRows.length - 1] || null;
        const tagSettingLabel =
          tagSettingRow?.querySelector(".bcampx-player-settings-label")
            ?.textContent || "";
        const tagSettingDesc =
          tagSettingRow?.querySelector(".bcampx-player-settings-description")
            ?.textContent || "";
        document.documentElement.setAttribute(
          "data-bcampx-fixture-tag-setting-label",
          tagSettingLabel,
        );
        document.documentElement.setAttribute(
          "data-bcampx-fixture-tag-setting-desc",
          tagSettingDesc,
        );
        document.documentElement.setAttribute(
          "data-bcampx-fixture-tag-setting-progress",
          String(/\(\d+\/\d+\)/.test(tagSettingDesc)),
        );

        // Matches that already exist as native cards reuse the native item, so
        // the first page of a collection keeps its cover art and preview data.
        searchInput.value = "nativeleft";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));
        for (let attempt = 0; attempt < 60; attempt += 1) {
          if (
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-tag-search-matches",
              ) || 0,
            ) === 2
          ) {
            break;
          }
          await wait(100);
        }
        await wait(900);
        const nativeTagCards = Array.from(
          document.querySelectorAll(
            '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-tag-source="tags"]',
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-native-origins",
          nativeTagCards
            .map((card) => card.getAttribute("data-bcampx-tag-origin"))
            .join(","),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-native-art",
          String(
            nativeTagCards.length === 2 &&
              nativeTagCards.every((card) =>
                Boolean(
                  card
                    .querySelector(".art img")
                    ?.getAttribute("src"),
                ),
              ),
          ),
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-native-playerdata",
          String(
            nativeTagCards.length === 2 &&
              nativeTagCards.every((card) =>
                Boolean(card.querySelector("[data-playerdata]")),
              ),
          ),
        );

        // A match that is not on the page is rendered from the index record, so
        // its cover art has to be derived from the stored art id.
        searchInput.value = "indexart";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));
        for (let attempt = 0; attempt < 60; attempt += 1) {
          if (
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-tag-search-matches",
              ) || 0,
            ) === 1
          ) {
            break;
          }
          await wait(100);
        }
        await wait(900);
        const indexTagCard = document.querySelector(
          '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-tag-origin="index"]',
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-index-origin",
          indexTagCard?.getAttribute("data-bcampx-tag-origin") || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-tag-index-art",
          indexTagCard?.querySelector(".art img")?.getAttribute("src") || "",
        );

        // A release page that parses without a tracklist still gets one from
        // the mobile release API.
        searchInput.value = "fallback";
        searchInput.dispatchEvent(new Event("input", { bubbles: true }));
        for (let attempt = 0; attempt < 60; attempt += 1) {
          if (
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-tag-search-matches",
              ) || 0,
            ) === 1
          ) {
            break;
          }
          await wait(100);
        }
        const fallbackCardSelectors = [
          '.bcampx-label-feed__list .bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-30"]',
          '.bcampx-tag-results .bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/release-30"]',
        ];
        let fallbackTrackLink = null;
        for (let attempt = 0; attempt < 60; attempt += 1) {
          fallbackTrackLink = fallbackCardSelectors
            .map((selector) =>
              document.querySelector(`${selector} .bcampx__track-link`),
            )
            .find(Boolean);
          if (fallbackTrackLink) {
            break;
          }
          await wait(100);
        }
        document.documentElement.setAttribute(
          "data-bcampx-tracklist-source",
          document.documentElement.getAttribute(
            "data-bcampx-tracklist-source",
          ) || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-api-tracklist-label",
          fallbackTrackLink?.textContent || "",
        );
        document.documentElement.setAttribute(
          "data-bcampx-api-tracklist-stream",
          fallbackTrackLink?.dataset.streamUrl || "",
        );

        // The tracklist must survive the feed syncs and index-progress
        // refreshes that follow; re-check after a delay instead of sampling
        // the instant it first appeared.
        await wait(2500);
        const fallbackTrackLinkAfter = fallbackCardSelectors
          .map((selector) =>
            document.querySelector(`${selector} .bcampx__track-link`),
          )
          .find(Boolean);
        document.documentElement.setAttribute(
          "data-bcampx-api-tracklist-after",
          fallbackTrackLinkAfter ? "present" : "missing",
        );
        document.documentElement.setAttribute(
          "data-bcampx-api-tracklist-after-label",
          fallbackTrackLinkAfter?.textContent || "",
        );

      })();
    </script>
  </body>
</html>
