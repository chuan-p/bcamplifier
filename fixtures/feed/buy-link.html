<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bandcamplifier Buy-Link Fixture</title>
    <meta property="og:site_name" content="Bandcamp" />
    <style>
      body {
        margin: 0;
        padding: 32px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .feed-item {
        list-style: none;
        margin: 0;
        padding: 20px;
        min-height: 220px;
        border: 1px solid #d1d5db;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .story-title {
        margin-bottom: 14px;
        font-size: 16px;
      }

      .item-link,
      .buy-link {
        color: #1d4ed8;
      }

      .tralbum-wrapper {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 18px;
      }

      .art img {
        display: block;
        width: 160px;
        height: 160px;
        object-fit: cover;
        border-radius: 12px;
      }

      .tralbum-wrapper-col1 > * + * {
        margin-top: 8px;
      }

      .tralbum-wrapper-collect-controls {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="pagedata" data-blob='{}'></div>
    <main>
      <article id="fixture-card" class="feed-item">
        <div class="story-title">
          <a class="fan-name" href="https://bandcamp.com/testfan">Test Fan</a>
          bought
          <a
            class="item-link"
            href="https://fixture.bandcamp.com/album/free-download-the-riverbed-ep"
            >FREE DOWNLOAD The Riverbed EP</a
          >
        </div>

        <div class="story-innards">
          <div class="story-body">
            <div class="tralbum-wrapper">
              <div class="art">
                <img
                  src="https://dummyimage.com/320x320/d1d5db/111827.png&text=Fixture"
                  alt="Fixture art"
                />
              </div>

              <div class="tralbum-wrapper-col1">
                <a
                  class="item-link"
                  href="https://fixture.bandcamp.com/album/free-download-the-riverbed-ep"
                  >FREE DOWNLOAD The Riverbed EP</a
                >
                <div class="tag-line">tags: ambient, drone</div>
              </div>
            </div>

            <div class="tralbum-wrapper-collect-controls">
              <a
                class="buy-link"
                href="https://fixture.bandcamp.com/album/free-download-the-riverbed-ep"
                >buy now</a
              >
            </div>
          </div>
        </div>
      </article>
    </main>

    <script>
      (() => {
        const releaseUrl =
          "https://fixture.bandcamp.com/album/free-download-the-riverbed-ep";
        const releaseHtml = `<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FREE DOWNLOAD The Riverbed EP | Kodama</title>
  </head>
  <body>
    <div
      data-tralbum='{"current":{"title":"FREE DOWNLOAD The Riverbed EP","release_date":"2024-01-02","about":"A free download EP.","id":123,"type":"album","band_id":654},"album_title":"FREE DOWNLOAD The Riverbed EP","artist":"Kodama","album_release_date":"2024-01-02","trackinfo":[{"title":"The Riverbed","track_id":"1","file":{"mp3-128":"https://example.com/riverbed.mp3"},"duration":180}]}'
    ></div>
    <div class="buyItem digital">Free Download</div>
  </body>
</html>`;

        globalThis.__BCAMPX_HOST__ = {
          kind: "webextension",
          requestHtml: async (url) => {
            if (url === releaseUrl) {
              return releaseHtml;
            }
            throw new Error(`Unexpected fixture request for ${url}`);
          },
          requestJson: async () => {
            throw new Error("requestJson is not used in this fixture");
          },
          storageGet: async (_key, fallback) => fallback,
          storageSet: async () => {},
        };

        window.setTimeout(() => {
          const card = document.querySelector("#fixture-card");
          const titleLink = card.querySelector(".story-title a.item-link");
          const buyLink = card.querySelector(
            ".tralbum-wrapper-collect-controls a.buy-link",
          );
          document.documentElement.setAttribute(
            "data-bcampx-title-text",
            titleLink ? titleLink.textContent.trim() : "",
          );
          document.documentElement.setAttribute(
            "data-bcampx-buy-text",
            buyLink ? buyLink.textContent.trim() : "",
          );
        }, 1500);
      })();
    </script>
    <script src="/bcamplifier.user.js"></script>
  </body>
</html>
