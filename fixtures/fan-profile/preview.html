<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collection Preview Fixture | Bandcamp</title>
  </head>
  <body>
    <div id="pagedata" hidden></div>

    <div class="collection-tabs">
      <ol>
        <li class="active" data-tab="collection" data-grid-id="collection-grid">
          collection
        </li>
      </ol>
    </div>

    <div id="collection-search">
      <input class="search-box" placeholder="search your collection..." />
    </div>

    <div id="collection-search-items" class="collection-items">
      <ol class="collection-grid">
        <li
          class="collection-item-container track_play_hilite"
          data-trackid="7004"
          data-itemid="7004"
          data-itemtype="album"
          data-tralbumid="7004"
          data-tralbumtype="a"
          data-bandid="700"
          data-title="Hidden Search Release"
        >
          <div class="collection-item-gallery-container">
            <div class="collection-item-art-container">
              <a class="track_play_auxiliary" data-trackid="7004">
                <img
                  class="collection-item-art"
                  src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
                  alt=""
                />
              </a>
            </div>
            <div class="collection-title-details">
              <div class="collection-item-title">Hidden Search Release</div>
              <div class="collection-item-artist">by Fixture Artist</div>
            </div>
          </div>
        </li>
      </ol>
    </div>

    <div id="grids">
      <div id="collection-grid" class="grid active">
        <div class="collection-items">
          <ol class="collection-list">
            <li
              class="collection-item-container track_play_hilite"
              data-trackid="7002"
              data-itemid="7002"
              data-itemtype="album"
              data-tralbumid="7002"
              data-tralbumtype="a"
              data-bandid="700"
              data-title="Preview Release"
            >
              <div class="collection-item-gallery-container">
                <div class="collection-item-art-container">
                  <a class="track_play_auxiliary" data-trackid="7002">
                    <img
                      class="collection-item-art"
                      src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
                      alt=""
                    />
                  </a>
                </div>
                <div class="collection-title-details">
                  <a
                    class="item-link"
                    href="https://fixture.bandcamp.com/album/preview-release"
                  >
                    <div class="collection-item-title">Preview Release</div>
                    <div class="collection-item-artist">
                      by Fixture Artist
                    </div>
                  </a>
                </div>
              </div>
            <li
              class="collection-item-container track_play_hilite"
              data-trackid="7003"
              data-itemid="7003"
              data-itemtype="track"
              data-tralbumid="7003"
              data-tralbumtype="t"
              data-bandid="700"
              data-title="Hidden Track Release"
            >
              <div class="collection-item-gallery-container">
                <div class="collection-item-art-container">
                  <a class="track_play_auxiliary" data-trackid="7003">
                    <img
                      class="collection-item-art"
                      src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
                      alt=""
                    />
                  </a>
                </div>
                <div class="collection-title-details">
                  <a
                    class="item-link"
                    href="https://fixture.bandcamp.com/track/hidden-track"
                  >
                    <div class="collection-item-title">
                      Hidden Track Release
                    </div>
                    <div class="collection-item-artist">
                      by Fixture Artist
                    </div>
                  </a>
                </div>
              </div>
            </li>
            </li>
          </ol>
        </div>
      </div>
    </div>

    <script>
      (() => {
        // Mirrors the current collection markup: item metadata and preview
        // streams live in pagedata (item_cache / tracklists), not in per-item
        // data attributes.
        const pagedata = {
          identities: { fan: { id: 42 } },
          fan_data: { fan_id: 42, is_own_page: true, name: "Fixture Fan" },
          current_fan: { fan_id: 42 },
          collection_data: {
            last_token: "",
            item_count: 2,
            batch_size: 20,
            sequence: ["c1", "c2"],
            redownload_urls: {
              7002: "https://bandcamp.com/download/preview-7002",
              7003: "https://bandcamp.com/download/hidden-7003",
            },
          },
          wishlist_data: {
            last_token: "",
            item_count: 0,
            batch_size: 20,
            sequence: [],
          },
          item_cache: {
            collection: {
              a7002: {
                item_id: 7002,
                item_type: "album",
                tralbum_id: 7002,
                tralbum_type: "a",
                album_id: 7002,
                item_title: "Preview Release",
                band_id: 700,
                band_name: "Fixture Artist",
                featured_track: 7002,
                featured_track_title: "Preview Song",
                item_url:
                  "https://fixture.bandcamp.com/album/preview-release",
              },
              t7003: {
              item_id: 7003,
              item_type: "track",
              tralbum_id: 7003,
              tralbum_type: "t",
              item_title: "Hidden Track Release",
              band_id: 700,
              band_name: "Fixture Artist",
              featured_track: 7003,
              featured_track_title: "Hidden Track",
              item_url: "https://fixture.bandcamp.com/track/hidden-track",
            },
            },
          },
          tracklists: {
            collection: {
              a7002: [
                {
                  id: 7002,
                  title: "Preview Song",
                  artist: "Fixture Artist",
                  track_number: 1,
                  duration: 120,
                  file: { "mp3-128": "/silence.wav" },
                },
              ],
              t7003: [
                {
                  id: 7003,
                  title: "Hidden Track",
                  artist: "Fixture Artist",
                  track_number: 1,
                  duration: 60,
                  file: { "mp3-128": "/silence.wav" },
                },
              ],
            },
          },
        };
        document
          .getElementById("pagedata")
          .setAttribute("data-blob", JSON.stringify(pagedata));

        const storage = new Map([
          [
            "bcampx:userSettings",
            { showCollectionCounts: false, enableTagSearch: false },
          ],
        ]);

        globalThis.__BCAMPX_HOST__ = {
          kind: "webextension",
          requestHtml: async () => {
            // The release page is gone; only the collection data is left.
            throw new Error("HTTP 404");
          },
          requestJson: async (url) => {
            if (String(url).includes("search_items")) {
              return {
                tralbums: [
                  {
                    item_id: 7004,
                    tralbum_id: 7004,
                    tralbum_type: "a",
                    item_title: "Hidden Search Release",
                    band_name: "Fixture Artist",
                    item_url:
                      "https://fixture.bandcamp.com/album/hidden-search",
                    item_art_url: "",
                    featured_track: 7004,
                    is_private: true,
                  },
                ],
                tracklists: {
                  a7004: [
                    {
                      id: 7004,
                      title: "Search Song",
                      duration: 90,
                      file: { "mp3-128": "/silence.wav" },
                    },
                  ],
                },
              };
            }
            return { error: true };
          },
          storageGet: async (key, fallback) =>
            storage.has(key) ? storage.get(key) : fallback,
          storageSet: async (key, value) => {
            storage.set(key, value);
          },
        };

        const wait = (ms) =>
          new Promise((resolve) => window.setTimeout(resolve, ms));

        const reportFixtureError = (value) => {
          const text = String(
            (value && (value.stack || value.message)) || value || "",
          ).slice(0, 260);
          document.documentElement.setAttribute(
            "data-bcampx-preview-error",
            text,
          );
        };
        window.addEventListener("error", (event) =>
          reportFixtureError(event.error || event.message),
        );
        window.addEventListener("unhandledrejection", (event) =>
          reportFixtureError(event.reason),
        );

        window.setTimeout(async () => {
          const root = document.documentElement;
          const card = () =>
            document.querySelector(
              '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/album/preview-release"]',
            );

          let row = null;
          for (let attempt = 0; attempt < 100; attempt += 1) {
            row = card()?.querySelector(".bcampx__track-link");
            if (row && row.dataset.streamUrl) {
              break;
            }
            await wait(100);
          }

          root.setAttribute(
            "data-bcampx-preview-row",
            row ? row.textContent.trim() : "",
          );
          root.setAttribute(
            "data-bcampx-preview-row-stream",
            String(Boolean(row && row.dataset.streamUrl)),
          );
          const action = card()?.querySelector(
            "[data-bcampx-release-action='buy']",
          );
          root.setAttribute(
            "data-bcampx-preview-action",
            action ? action.textContent.trim() : "",
          );
          root.setAttribute(
            "data-bcampx-preview-download",
            action
              ? action.getAttribute("data-bcampx-digital-download-url") || ""
              : "",
          );

          for (let attempt = 0; attempt < 100; attempt += 1) {
            if (
              card()?.getAttribute("data-bcampx-release-unavailable") ===
              "true"
            ) {
              break;
            }
            await wait(100);
          }
          root.setAttribute(
            "data-bcampx-preview-unavailable",
            String(
              card()?.getAttribute("data-bcampx-release-unavailable") ===
                "true",
            ),
          );

          const trigger = document.querySelector(
            "#collection-grid .track_play_auxiliary",
          );
          if (trigger) {
            trigger.click();
          }
          await wait(3000);

          const host = document.querySelector("#bcampx-player-host");
          const shadow = host ? host.shadowRoot : null;
          const track = shadow
            ? shadow.querySelector(".bcampx-player-track")
            : null;
          const store = shadow
            ? shadow.querySelector(".bcampx-player-store")
            : null;
          root.setAttribute(
            "data-bcampx-preview-player-track",
            track ? track.textContent.trim() : "",
          );
          root.setAttribute(
            "data-bcampx-preview-player-store",
            store ? store.textContent.trim() : "",
          );
          root.setAttribute(
            "data-bcampx-preview-player-active",
            String(
              document.documentElement.classList.contains(
                "bcampx-player-active",
              ),
            ),
          );
          const hiddenCard = document.querySelector(
            '.bcampx-label-feed-card[data-bcampx-release-url="https://fixture.bandcamp.com/track/hidden-track"]',
          );
          const hiddenLink = hiddenCard
            ? hiddenCard.querySelector("a.item-link")
            : null;
          let linkPrevented = false;
          if (hiddenLink) {
            const linkEvent = new MouseEvent("click", {
              bubbles: true,
              cancelable: true,
              view: window,
            });
            hiddenLink.dispatchEvent(linkEvent);
            linkPrevented = linkEvent.defaultPrevented;
          }
          for (let attempt = 0; attempt < 50; attempt += 1) {
            if (
              hiddenCard?.getAttribute("data-bcampx-release-unavailable") ===
              "true"
            ) {
              break;
            }
            await wait(100);
          }
          root.setAttribute(
            "data-bcampx-preview-link-prevented",
            String(linkPrevented),
          );
          root.setAttribute(
            "data-bcampx-preview-link-unavailable",
            String(
              hiddenCard?.getAttribute("data-bcampx-release-unavailable") ===
                "true",
            ),
          );

          const searchInput = document.querySelector(
            "#collection-search input",
          );
          if (searchInput) {
            searchInput.value = "hidden-search";
            searchInput.dispatchEvent(new Event("input", { bubbles: true }));
          }
          const searchItem = document.querySelector(
            "#collection-search-items .collection-item-container",
          );
          const searchPlay = searchItem
            ? searchItem.querySelector(".track_play_auxiliary")
            : null;
          if (searchPlay) {
            searchPlay.click();
          }
          await wait(2500);
          const searchTrack = shadow
            ? shadow.querySelector(".bcampx-player-track")
            : null;
          root.setAttribute(
            "data-bcampx-preview-search-player",
            searchTrack ? searchTrack.textContent.trim() : "",
          );
          root.setAttribute(
            "data-bcampx-preview-search-unavailable",
            String(
              searchItem?.getAttribute("data-bcampx-release-unavailable") ===
                "true",
            ),
          );

          root.setAttribute("data-bcampx-preview-done", "true");
        }, 1200);
      })();
    </script>
    <script src="/bcamplifier.user.js"></script>
  </body>
</html>
