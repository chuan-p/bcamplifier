<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incremental Fan Collection | Bandcamp</title>
  </head>
  <body>
    <div
      id="pagedata"
      data-blob='{"identities":{"fan":{"id":42}},"fan_data":{"fan_id":42,"is_own_page":true,"name":"Fixture Fan"},"current_fan":{"fan_id":42},"collection_data":{"last_token":"","item_count":2,"batch_size":20,"sequence":["i1","i2"]},"item_cache":{"i1":{"item_id":1,"tralbum_id":1,"tralbum_type":"a","band_id":1001,"item_url":"https://fixture.bandcamp.com/album/release-1","item_title":"Release 1","band_name":"Artist 1"},"i2":{"item_id":2,"tralbum_id":2,"tralbum_type":"a","band_id":1002,"item_url":"https://fixture.bandcamp.com/album/release-2","item_title":"Release 2","band_name":"Artist 2"}}}'
      hidden
    ></div>

    <div class="collection-tabs">
      <ol>
        <li class="active" data-tab="collection" data-grid-id="collection-grid">
          collection
        </li>
      </ol>
    </div>

    <div id="grids">
      <div id="collection-grid" class="grid active">
        <div class="collection-items">
          <ol class="collection-grid"></ol>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const storage = new Map([
          [
            "bcampx:userSettings",
            { showCollectionCounts: false, enableTagSearch: false },
          ],
          ["bcampx:artistMusicView", "feed"],
        ]);

        globalThis.__BCAMPX_HOST__ = {
          kind: "webextension",
          requestHtml: async () => {
            throw new Error("release page is not available in this fixture");
          },
          requestJson: async () => {
            throw new Error("requestJson is not used in this fixture");
          },
          storageGet: async (key, fallback) =>
            storage.has(key) ? storage.get(key) : fallback,
          storageSet: async (key, value) => {
            storage.set(key, value);
          },
          storageRemove: async (key) => {
            storage.delete(key);
          },
        };

        globalThis.__makeIncrementalItem = (id) => {
          const releaseUrl = `https://fixture.bandcamp.com/album/release-${id}`;
          const item = document.createElement("li");
          item.className = "collection-item-container";
          item.setAttribute("data-itemid", String(id));
          item.setAttribute("data-tralbumid", String(id));
          item.setAttribute("data-tralbumtype", "a");
          item.setAttribute("data-bandid", String(1000 + id));
          item.setAttribute(
            "data-playerdata",
            JSON.stringify({
              album: {
                id,
                title: `Release ${id}`,
                url: releaseUrl,
                is_owned: true,
              },
              id,
              title: `Track ${id}`,
              artist_name: `Artist ${id}`,
              url: `${releaseUrl}/track-${id}`,
              stream_url: `https://example.com/${id}.mp3`,
              duration: 120,
            }),
          );
          item.innerHTML = `
            <a class="item-link" href="${releaseUrl}">
              <span class="collection-item-title">Release ${id}</span>
              <span class="collection-item-artist">by Artist ${id}</span>
            </a>
          `;
          return item;
        };

        const grid = document.querySelector("#collection-grid ol.collection-grid");
        grid.append(
          globalThis.__makeIncrementalItem(1),
          globalThis.__makeIncrementalItem(2),
        );

        window.setTimeout(async () => {
          const wait = (ms) =>
            new Promise((resolve) => window.setTimeout(resolve, ms));
          for (let attempt = 0; attempt < 200; attempt += 1) {
            if (
              Number(
                document.documentElement.getAttribute(
                  "data-bcampx-label-feed-count",
                ) || 0,
              ) >= 2
            ) {
              break;
            }
            await wait(50);
          }
          grid.append(globalThis.__makeIncrementalItem(3));
          await wait(1200);
          document.documentElement.setAttribute(
            "data-debug-incremental-feed-count",
            document.documentElement.getAttribute(
              "data-bcampx-label-feed-count",
            ) || "",
          );
          document.documentElement.setAttribute(
            "data-debug-incremental-syncs",
            document.documentElement.getAttribute(
              "data-bcampx-label-feed-incremental-sync-count",
            ) || "0",
          );
          document.documentElement.setAttribute(
            "data-debug-incremental-used",
            Number(
              document.documentElement.getAttribute(
                "data-bcampx-label-feed-incremental-sync-count",
              ) || 0,
            ) > 0
              ? "true"
              : "false",
          );
          document.documentElement.setAttribute(
            "data-debug-incremental-card",
            document.querySelector(
              '.bcampx-label-feed-card[data-bcampx-release-url*="release-3"]',
            )
              ? "present"
              : "missing",
          );
        }, 0);
      })();
    </script>
    <script src="/bcamplifier.user.js"></script>
  </body>
</html>
