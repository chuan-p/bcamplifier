name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # The browser smoke tests install the one browser they need in the
          # next step; downloading all three on install only slows CI down.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Export Chromium path
        run: |
          CHROME_BIN=$(node -e "const { chromium } = require('playwright'); console.log(chromium.executablePath())")
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Syntax check sources
        run: |
          for file in $(find src -name '*.js' | sort); do
            node --check "$file"
          done
          node --check extension.background.js
          node --check extension.content.js
          node --check extension.shared.js
          node --check extension.host-errors.js
          node --check extension.host-permission.js

      - name: Rebuild userscript from source
        run: node scripts/build-userscript.mjs

      - name: Verify the committed userscript is up to date
        run: |
          node --check bcamplifier.user.js
          git diff --exit-code -- bcamplifier.user.js
          git diff --exit-code -- extension.host-errors.js

      - name: Check version consistency
        run: ./scripts/check-versions.sh

      - name: Check for unused source functions
        run: node scripts/check-unused-symbols.mjs

      - name: Run unit tests
        run: npm test

      - name: Validate extension scope
        run: ./scripts/check-extension-scope.sh

      - name: Build extension packages
        run: ./scripts/build-extension.sh

      - name: Smoke test extension build
        run: xvfb-run -a ./scripts/smoke-test-extension.sh

      - name: Run fixture tests
        run: npm run test:fixtures
